esphome:
  name: frekvens
  friendly_name: Frekvens

esp32:
  board: az-delivery-devkit-v4
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret frekvens__encryption_key

ota:
  - platform: esphome
    password: !secret frekvens__ota_password
    # The panel runs a high-priority task and a hardware timer. Stop both while
    # the OTA backend writes flash, otherwise the task can preempt a cache-off
    # flash operation and trip the task watchdog.
    on_begin:
      - lambda: |-
          id(frekvens_panel).suspend();
    on_abort:
      - lambda: |-
          id(frekvens_panel).resume();
    on_error:
      - lambda: |-
          id(frekvens_panel).resume();
    on_end:
      - lambda: |-
          id(frekvens_panel).resume();

button:
  - platform: safe_mode
    name: Safe Mode

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  domain: .lan

external_components:
  - source:
      type: local
      path: components
    components: [frekvens]

display:
  - platform: frekvens
    id: frekvens_panel
    data_pin: GPIO27
    clock_pin: GPIO14
    latch_pin: GPIO19
    enable_pin: GPIO26
    clock_speed: 25000000
    # Boot with the panel off; the Brightness number controls it at runtime.
    # Brightness is applied to the pixel values before BAM, so the refresh rate
    # stays constant.
    brightness: 0%
    update_interval: 33ms
    lambda: |-
      // Soft diagonal grayscale gradient. Replace this lambda with your own
      // drawing code; Color(0, 0, 0, v) is the 8-bit grayscale value.
      for (int y = 0; y < 16; y++) {
        for (int x = 0; x < 16; x++) {
          it.draw_pixel_at(x, y, Color(0, 0, 0, (x + y) * 255 / 30));
        }
      }

number:
  - platform: template
    name: Brightness
    id: frekvens_brightness
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    unit_of_measurement: "%"
    set_action:
      - lambda: |-
          id(frekvens_panel).set_brightness(x / 100.0f);
