esphome:
  name: frekvens-recovery
  friendly_name: Frekvens Recovery

esp32:
  board: az-delivery-devkit-v4
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret frekvens__encryption_key

ota:
  - platform: esphome
    password: !secret frekvens__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  domain: .lan

# Keep the panel's active-low output-enable line high (LEDs off) while this
# recovery image runs; it has no display component.
output:
  - platform: gpio
    pin:
      number: GPIO26
      inverted: true
    id: panel_enable
